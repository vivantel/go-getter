# Reusable by the release workflow; also runnable on its own.
# Behavior evals, layer 3 of decision 0013 (decision 0065): deterministic, no model and no secret.
name: eval

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm run eval
      - run: npm run check:deps
