# Deterministic verification layers 1 and 2 (decision 0013); job names are required status checks on main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22 # oldest supported LTS (decision 0019)
      - run: npm test

  golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Regenerated output matches the committed files
        run: |
          npm run build
          git status --porcelain
          test -z "$(git status --porcelain)"
      - run: npm run check:generated

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm run check:neutral
      - run: npm run check:guardrails
      - run: npm run check:tags
      - run: npm run check:deps
      - run: npm run check:node-floor
      - run: npm run check:packs
      - run: npm run check:plans
      - run: npm run check:versions
